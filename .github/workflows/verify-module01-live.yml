name: Verify Modul 01 editorial changes in production
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-module01-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all 8 slide titles and exact material against main
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,hashlib,time,sys
          url="https://kelasbelajar.org/lensa-muda/slides.js"
          markers=[
           "Apa yang membuat foto terasa bercerita?",
           "Fotografi itu bercerita dengan cahaya",
           "Pahami Segi Tiga ini sebelum memotret",
           "Bukaan mengubah kedalaman ruang",
           "Membekukan atau merekam gerakan?",
           "Foto yang terang bukan tanpa konsekuensi",
           "Exposure mirip, karakter berbeda",
           "Sekarang mari kita bereksperimen",
           "Silahkan bereksperimen di simulator?"
          ]
          for attempt in range(1,5):
            try:
              req=urllib.request.Request(url+"?audit=module01-"+str(attempt),headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                body=response.read()
                code=response.status
                typ=response.headers.get("Content-Type","")
              text=body.decode("utf-8")
              print("CHECK",attempt,"STATUS",code,"TYPE",typ,"BYTES",len(body),"SHA256",hashlib.sha256(body).hexdigest(),flush=True)
              for i,marker in enumerate(markers,1):
                print("MARKER",i,"FOUND",marker in text,flush=True)
              if code==200 and all(m in text for m in markers):
                print("PASS: Modul 01 revised content is live",flush=True)
                sys.exit(0)
            except Exception as e:print("ERROR",str(e),flush=True)
            time.sleep(10)
          sys.exit("FAIL: Modul 01 revised content not live")
          PY
