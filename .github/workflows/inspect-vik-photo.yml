name: Inspect original Hong Bit in archive
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/inspect-vik-photo.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published photo source
        run: |
          python - <<'PY'
            import urllib.request,re,html
            url='https://vik.kompas.com/perempuan-dayak/'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as f:
             doc=f.read().decode('utf-8','replace')
            print('document size',len(doc))
            for kw in ['Hong Bit','hong-bit','HongBit','_MG_1225','hongbit','hong_bit','image']:
             matches=list(re.finditer(re.escape(kw),doc,re.I))
             print('term',kw,'hits',len(matches))
             for m in matches[:5]:
              print(doc[max(0,m.start()-260):m.end()+260].replace('\\n',' ')[:530])
            for m in re.findall(r'(?i)(?:src|data-src|background-image|url)\\s*[=:]\\s*["\\']?([^"\\' <>]+)',doc):
             if any(x in m.lower() for x in ['hong','bit','photo','image','media','jpg']):print('candidate',html.unescape(m)[:240])
            
          PY
