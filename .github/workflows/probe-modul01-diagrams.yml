name: Verify Modul 01 camera diagrams live
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-modul01-diagrams.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CSS and JS in Cloudflare production
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,time,sys
          base="https://kelasbelajar.org/lensa-muda/"
          for n in range(1,6):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as r:return r.status,r.read()
                  sh,html=get("?live-camera-probe="+str(n))
                  sj,js=get("app.js?live-camera-probe="+str(n))
                  sc,css=get("styles.css?live-camera-probe="+str(n))
                  marker=b"20261114-camera-diagrams-v6"
                  checks={
                    "html":marker in html,
                    "js":b"function cameraDetailVisual(detail)" in js and b"camera-shutter-track" in js and b"camera-exposure-reading" in js,
                    "css":b".photo-detail-media-split" in css and b".iris-narrow" in css,
                    "http":sh==200 and sj==200 and sc==200
                  }
                  print("ATTEMPT",n,checks,flush=True)
                  if all(checks.values()):
                      print("PASS: production serves updated Modul 01 diagram files",flush=True)
                      sys.exit(0)
              except Exception as exc:print("ERROR",n,str(exc),flush=True)
              time.sleep(12)
          sys.exit("FAIL: production is still serving the older module")
          PY
