name: Verify edited Modul 02 composition live
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-composition-text.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read only verify revised composition slides on Cloudflare
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,hashlib,time,sys
          base="https://kelasbelajar.org/lensa-muda/composition.js"
          markers=[
            "Garis sepertiga adalah alat bantu, tetapi bukan wajib.",
            "Ruang papan tulis di sini punya fungsi, bukan sekadar ruang kosong.",
            "Tokoh lebih dominan: apa yang berubah?",
            "Lapisan depan menunjukkan posisi pemotret.",
            "Foto lebar = kegiatan kolektif",
            "Foto detail: menyajikan pola",
            "Elemen alat musik di foreground membangun lapisan",
            "Bentuk pemain muncul sebagai siluet di depan visual proyektor"
          ]
          for n in range(1,6):
            try:
              req=urllib.request.Request(base+"?audit-composition="+str(n),headers={"Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=25) as r:
                raw=r.read();status=r.status
              text=raw.decode("utf8")
              checks={str(i):m in text for i,m in enumerate(markers,1)}
              print("CHECK",n,"HTTP",status,"BYTES",len(raw),"SHA256",hashlib.sha256(raw).hexdigest(),"MARKERS",checks,flush=True)
              if status==200 and all(checks.values()):
                print("PASS: revised 11 composition slides are served in production",flush=True)
                sys.exit(0)
            except Exception as e:print("ERROR",repr(e),flush=True)
            time.sleep(12)
          sys.exit("FAIL: latest composition text not yet live")
          PY
