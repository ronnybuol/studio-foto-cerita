name: Verify live counter and roster rollout
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-roster-live.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Require latest Cloudflare version (retry for deployment lag)
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,time,sys
          base="https://kelasbelajar.org/lensa-muda/"
          for attempt in range(1,9):
              try:
                  req=urllib.request.Request(base+"?v=20261114-orientation-live-v5-check-"+str(attempt),headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=20) as r: html=r.read()
                  with urllib.request.urlopen(urllib.request.Request(base+"app.js?probe="+str(attempt),headers={"Cache-Control":"no-cache"}),timeout=20) as r: app=r.read()
                  with urllib.request.urlopen(urllib.request.Request(base+"api/state?probe="+str(attempt),headers={"Cache-Control":"no-cache"}),timeout=20) as r: state=json.loads(r.read())
                  ok=b"20261114-orientation-live-v5" in html and b"orientationRosterSlide(" in app and "roster" in state
                  print("ATTEMPT",attempt,"VERSION",b"20261114-orientation-live-v5" in html,"UI",b"orientationRosterSlide(" in app,"API", "roster" in state,flush=True)
                  if ok:sys.exit(0)
              except Exception as e:print("RETRY",str(e),flush=True)
              time.sleep(20)
          sys.exit("Cloudflare belum menjalankan versi terbaru setelah pemeriksaan berulang")
          PY
