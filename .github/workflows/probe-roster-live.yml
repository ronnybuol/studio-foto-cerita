name: Verify live counter and roster rollout
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-roster-live.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed frontend and nonmutating state
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json
          base="https://kelasbelajar.org/lensa-muda/"
          for path in ("","app.js?v=20261114-orientation-live-v5","styles.css?v=20261114-orientation-live-v5","api/state"):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"}),timeout=25) as r:
                      payload=r.read()
                      print("CHECK",path or "/",r.status,len(payload),r.headers.get("content-type"))
                      if path=="": print("VERSION_V5",b"20261114-orientation-live-v5" in payload)
                      if path.startswith("app.js"): print("ROSTER_UI",b"orientationRosterSlide" in payload,"LIVE_COUNTER",b"orientation-registered-count" in payload,"TRAINER_BUTTON",b"trainer-show-roster" in payload)
                      if path.startswith("styles.css"): print("ROSTER_STYLES",b"orientation-roster-grid" in payload)
                      if path=="api/state":
                          d=json.loads(payload)
                          print("STATE_HAS_COUNT",isinstance(d.get("count"),int),"ROSTER_FLAG",d.get("roster"),"STAGE",d.get("stage"))
              except Exception as e:
                  print("PROBE_FAILED",path,str(e));raise
          PY
