name: Deploy Studio Foto Cerita to Cloudflare
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-once.yml]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Deploy Worker assets without modifying D1
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN belum tersedia. Tidak bisa deploy dari Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID belum tersedia. Tidak bisa deploy dari Actions."
            exit 1
          fi
          npx wrangler deploy
