name: Verify production Lensa Muda launch
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-live.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live root, participant form, and media assets
        shell: bash
        run: |
          set +e
          for path in /lensa-muda/ /lensa-muda/peserta /lensa-muda/assets/brand/hong-bit.webp /lensa-muda/assets/brand/kamisama.png /lensa-muda/assets/brand/zonautara.png /lensa-muda/assets/brand/peserta-qr.svg; do
            echo "CHECK $path"
            curl --retry 2 --max-time 22 -sSL -o /tmp/probe -w 'HTTP:%{http_code} CONTENT-TYPE:%{content_type} BYTES:%{size_download}\n' "https://kelasbelajar.org$path"
            if [ "$path" = "/lensa-muda/" ] || [ "$path" = "/lensa-muda/peserta" ]; then
              if grep -q '20261114-kamisama-v2' /tmp/probe; then echo "DEPLOYED_NEW_VERSION=true"; else echo "DEPLOYED_NEW_VERSION=false"; fi
              if grep -q 'brand-logo-kamisama' /tmp/probe; then echo "KAMISAMA_HEADER=true"; else echo "KAMISAMA_HEADER=false"; fi
            fi
          done
