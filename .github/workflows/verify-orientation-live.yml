name: Verify live orientation 00
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-orientation-live.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only check of live production
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          base="https://kelasbelajar.org/lensa-muda/"
          for path in ("","app.js?v=20261114-orientation-v4","styles.css?v=20261114-orientation-v4","peserta"):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:
                  payload=r.read()
                  print("CHECK",path or "/",r.status,len(payload),r.headers.get("content-type"))
                  if path=="":print("LIVE_HTML_VERSION",b"20261114-orientation-v4" in payload)
                  if path.startswith("app.js"):print("LIVE_ORIENTATION_FUNCTION",b"orientationRegistrationSlide()" in payload,"TRAINER_BUTTON",b"trainer-show-registration" in payload)
                  if path.startswith("styles.css"):print("LIVE_ORIENTATION_CSS",b"lcd-orientation-registration" in payload)
          PY
