name: Verify four composition challenges in Cloudflare
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-composition-ab.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only production check
        run: |
          python - <<'PY'
          import urllib.request,json,time,sys
          base="https://kelasbelajar.org/lensa-muda/"
          photos=["5625","5794","5711","5712","8798","8824","8980","8851"]
          for attempt in range(1,7):
            try:
              def get(path):
                req=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
                with urllib.request.urlopen(req,timeout=25) as res:return res.status,res.read()
              sh,html=get("?comp-ab-audit="+str(attempt))
              sj,js=get("app.js?comp-ab-audit="+str(attempt))
              sc,css=get("styles.css?comp-ab-audit="+str(attempt))
              sd,data=get("composition-lab.js?comp-ab-audit="+str(attempt))
              sa,api=get("api/state?comp-ab-audit="+str(attempt))
              imgs={p:get("assets/composition/sangihe-2017-"+p+".webp")[0] for p in photos}
              state=json.loads(api)
              checks={
               "html":b"20261115-composition-ab-v9" in html,
               "js":b"function compositionTrainerResponsePanel(" in js and b"function bindCompositionChallenge(" in js and b"comp-spotlight" in js,
               "css":b".comp-compare-photos" in css and b".comp-spotlight-reason" in css,
               "module":b"COMPOSITION_CHALLENGES" in data and b"5625" in data and b"5712" in data,
               "photos":all(s==200 for s in imgs.values()),
               "api":sa==200 and isinstance(state.get("stage"),int) and "spotlight" in state,
               "http":sh==sj==sc==sd==200
              }
              print("ATTEMPT",attempt,checks,"PHOTO_HTTP",imgs,"CURRENT_STAGE",state.get("stage"),flush=True)
              if all(checks.values()):
                print("PASS: all composition A/B assets and worker state are available in production",flush=True)
                sys.exit(0)
            except Exception as e:print("ERROR",str(e),flush=True)
            time.sleep(12)
          sys.exit("FAIL: Cloudflare not yet serving complete A/B composition release")
          PY
